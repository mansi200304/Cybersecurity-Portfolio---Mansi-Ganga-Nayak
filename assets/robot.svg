<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D3D3D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A9A9A9;stop-opacity:1" />
    </linearGradient>
    <filter id="metallic">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g id="robot-body">
    <rect x="75" y="180" width="150" height="180" rx="10" fill="url(#bodyGradient)" stroke="#606060" stroke-width="3" filter="url(#metallic)"/>
    
    <rect x="50" y="200" width="30" height="80" rx="5" fill="url(#bodyGradient)" stroke="#606060" stroke-width="2"/>
    <rect x="220" y="200" width="30" height="80" rx="5" fill="url(#bodyGradient)" stroke="#606060" stroke-width="2"/>
    
    <circle cx="65" cy="300" r="8" fill="#4A4A4A" stroke="#606060" stroke-width="2"/>
    <circle cx="235" cy="300" r="8" fill="#4A4A4A" stroke="#606060" stroke-width="2"/>
    
    <rect x="90" y="365" width="40" height="30" rx="3" fill="url(#bodyGradient)" stroke="#606060" stroke-width="2"/>
    <rect x="170" y="365" width="40" height="30" rx="3" fill="url(#bodyGradient)" stroke="#606060" stroke-width="2"/>
    
    <rect x="100" y="210" width="100" height="60" rx="5" fill="#2A2A2A" stroke="#00FF00" stroke-width="2" opacity="0.7"/>
    <line x1="110" y1="225" x2="190" y2="225" stroke="#00FF00" stroke-width="1" opacity="0.5"/>
    <line x1="110" y1="235" x2="180" y2="235" stroke="#00FF00" stroke-width="1" opacity="0.5"/>
    <line x1="110" y1="245" x2="190" y2="245" stroke="#00FF00" stroke-width="1" opacity="0.5"/>
    <line x1="110" y1="255" x2="170" y2="255" stroke="#00FF00" stroke-width="1" opacity="0.5"/>
    
    <circle cx="120" cy="310" r="15" fill="#00FFFF" opacity="0.6"/>
    <circle cx="120" cy="310" r="8" fill="#00FFFF" opacity="0.9"/>
    <circle cx="180" cy="310" r="15" fill="#00FFFF" opacity="0.6"/>
    <circle cx="180" cy="310" r="8" fill="#00FFFF" opacity="0.9"/>
  </g>
  
  <g id="robot-neck">
    <rect x="135" y="155" width="30" height="30" rx="3" fill="url(#bodyGradient)" stroke="#606060" stroke-width="2"/>
    <circle cx="150" cy="170" r="4" fill="#4A4A4A"/>
  </g>
  
  <g id="robot-head" transform-origin="150 100">
    <rect x="100" y="60" width="100" height="90" rx="8" fill="url(#headGradient)" stroke="#606060" stroke-width="3" filter="url(#metallic)"/>
    
    <rect x="110" y="75" width="35" height="30" rx="3" fill="#1A1A1A" stroke="#00FFFF" stroke-width="2"/>
    <rect x="155" y="75" width="35" height="30" rx="3" fill="#1A1A1A" stroke="#00FFFF" stroke-width="2"/>
    
    <circle cx="127" cy="90" r="8" fill="#00FFFF" opacity="0.8"/>
    <circle cx="127" cy="90" r="4" fill="#00FFFF"/>
    <circle cx="173" cy="90" r="8" fill="#00FFFF" opacity="0.8"/>
    <circle cx="173" cy="90" r="4" fill="#00FFFF"/>
    
    <rect x="115" y="120" width="70" height="15" rx="7" fill="#4A4A4A" stroke="#606060" stroke-width="2"/>
    <rect x="120" y="125" width="10" height="5" rx="1" fill="#00FF00"/>
    <rect x="135" y="125" width="10" height="5" rx="1" fill="#00FF00"/>
    <rect x="150" y="125" width="10" height="5" rx="1" fill="#00FF00"/>
    <rect x="165" y="125" width="10" height="5" rx="1" fill="#00FF00"/>
    
    <polygon points="95,80 100,75 100,85" fill="#B0B0B0" stroke="#606060" stroke-width="1"/>
    <polygon points="205,80 200,75 200,85" fill="#B0B0B0" stroke="#606060" stroke-width="1"/>
    
    <line x1="110" y1="140" x2="120" y2="145" stroke="#00FFFF" stroke-width="1" opacity="0.6"/>
    <line x1="180" y1="140" x2="190" y2="145" stroke="#00FFFF" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
